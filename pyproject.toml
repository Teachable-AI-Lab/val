[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[project]
name = "val"
dynamic = ["version"]
authors = [
  { name="Chris MacLellan", email="cmaclell@gatech.edu" },
]
description = "A refactored VAL 2.0"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "shop2@git+https://github.com/Teachable-AI-Lab-TAIL/shop2.git@val",
    "py_search@git+https://github.com/cmaclell/py_search@master",
    "pygame",
    "overcooked-ai",
    "scipy",
    "numpy",
    "python-socketio",
    "flask",
    "flask-socketio",
    "requests",
    "tabulate",
    "openai",
    "PyYAML",
    "websocket-client"
]

[project.urls]
Homepage = "https://github.com/Teachable-AI-Lab/val"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["val*"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

